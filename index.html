<!doctype html>
<html lang="zh-CN" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#5f303c">
  <meta name="description" content="送给朱熠欣的一封生日祝福">
  <title>朱熠欣，生日快乐</title>
  <link rel="preload" href="assets/photo-cover.webp" as="image" type="image/webp">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.replace("no-js","js")</script>
  <script src="postcard.js" defer></script>
</head>
<body>
  <main>
    <section class="cover" aria-labelledby="birthday-title">
      <img class="cover__photo" src="assets/photo-cover.webp" alt="身着古装的两人在暖光中相伴而坐">
      <div class="cover__shade" aria-hidden="true"></div>
      <div class="cover__sparkles" aria-hidden="true"></div>
      <div class="cover__content">
        <p class="eyebrow">A LITTLE BIRTHDAY LETTER</p>
        <h1 id="birthday-title"><span>朱熠欣</span>生日快乐</h1>
        <p class="cover__wish">愿你岁岁常欢愉，年年皆胜意</p>
        <button id="open-card" class="open-button" type="button">
          <span>轻触，拆开祝福</span>
          <i aria-hidden="true">↓</i>
        </button>
      </div>
      <p class="cover__hint">为你珍藏的这一刻</p>
    </section>

    <section id="story" class="story" aria-labelledby="letter-title">
      <div id="petals" class="petals" aria-hidden="true"></div>
      <div class="story__photo-wrap">
        <img class="story__photo" src="assets/photo-story.webp" alt="两人在一束温柔光线下相伴而坐" loading="lazy">
        <div class="story__photo-fade" aria-hidden="true"></div>
        <p class="story__photo-note">愿此刻的光，也照亮你新一岁的每一天</p>
      </div>

      <article class="letter">
        <p class="letter__mark" aria-hidden="true">✦</p>
        <p class="eyebrow">FOR ZHU YIXIN</p>
        <h2 id="letter-title">写给闪闪发光的你</h2>
        <div class="letter__body">
          <p>愿新一岁的你，眼里常有星光，<br>身边总有温柔，所念皆有回应。</p>
          <p>愿每一场相遇都有意义，<br>每一段故事都有温暖的结局。</p>
          <p class="letter__birthday">朱熠欣，生日快乐。<br>岁岁欢愉，永远闪闪发光。</p>
        </div>
        <p class="signature">——沈梦秋，哦不，琉璃大魔王</p>
        <div class="letter__seal" aria-hidden="true">生辰<br>吉乐</div>
      </article>
    </section>
  </main>

  <button id="sound-toggle" class="sound-toggle" type="button" aria-label="播放背景音乐" aria-pressed="false">
    <span class="sound-toggle__icon" aria-hidden="true">♪</span>
    <span class="sound-toggle__text">音乐</span>
  </button>

  <noscript>
    <style>.open-button,.sound-toggle{display:none!important}.story{display:block!important}</style>
  </noscript>
</body>
</html>
